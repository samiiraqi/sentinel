name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # full history: the git_history agent scans it

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: constraints-ci.txt

      - name: Install dev dependencies
        run: >-
          pip install -c constraints-ci.txt
          -r requirements-dev.txt
          -r requirements-backend.txt
          -r requirements-terraform.txt
          -r requirements-sast.txt
          -r requirements-gha.txt

      - name: Run tests
        env:
          SENTINEL_REQUIRE_ALL_TESTS: "1"
        run: python -m pytest -q

      - name: Scan repo for secrets
        run: python -m agents.secrets.agent . --exclude tests/fixtures --exclude .venv
